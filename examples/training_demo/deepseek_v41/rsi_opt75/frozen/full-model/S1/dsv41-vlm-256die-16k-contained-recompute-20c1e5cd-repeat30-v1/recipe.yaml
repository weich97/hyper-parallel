  ep_size: 128
  loss_parallel: false
  pp_size: 1
  sequence_parallel: false
  tp_size: 1
activation_checkpoint:
  mode: full
  swap_inputs: true
activation_swap: none
checkpoint:
  checkpoint_dir: /xw-tree/full-v41/full-model/S1/dsv41-vlm-256die-16k-host-cache-34868068-v1/checkpoints
  is_async: false
  restore_dataloader_state: true
  restore_from: null
  restore_optimizer: true
  restore_train_state: true
  save_ckpt: false
  save_epochs: 1
  save_extra_state_per_rank: true
  save_optimizer: true
  save_steps: 10
  save_train_state: true
compile:
  backend: null
  dynamic: false
  dynamo_cache_size_limit: 256
  enabled: false
  fullgraph: false
  mode: default
  options: {}
dataloader:
  _target_: hyper_parallel.data.batching.OmniPackingLoader
  collate_fn:
    _target_: hyper_parallel.data.batching.build_omni_collate_fn
    pad_to_length: 16384
  drop_last: true
  get_batch:
    _target_: hyper_parallel.data.batching.OmniParallelBatch
    runtime_input_adapter:
      _target_: hyper_parallel.models.deepseek_v41.adapter.data.runtime.DeepseekV41Runtime
  min_buffered_samples: 1
  num_workers: 0
  pin_memory: false
  prefetch_factor: null
  sampler_type: single
  token_budget: 16384
dataset:
  _target_: hyper_parallel.data.omni.build_dataset.build_online_omni_mapping_dataset
  data_config: {}
  data_path: /xw-tree/full-v41/full-model/S1/dsv41-vlm-256die-16k-combination-hsdp32-repeat30-0907ccda-v4/train-repeat.jsonl
  data_transform:
    _target_: hyper_parallel.models.deepseek_v41.adapter.data.transform_fn.build_deepseek_v41_omni_transform
    max_seq_len: 16384
    sample_alignment_size: 16
    sample_format: image_caption
  model_assets:
    _target_: hyper_parallel.models.deepseek_v41.adapter.data.processor.build_deepseek_v41_processor
    config_path: /xw-tree/full-v41/hf-metadata
  training_mode: pretrain
debug:
  check_dataset: warn
  check_nan_inf: false
fsdp_config:
  backward_prefetch_depth: 2
  comm_fusion: false
  dp_shard_size: 32
  edp_shard_size: 2
  forward_prefetch_depth: 2
  mix_precision:
    cast_forward_inputs: false
    param_dtype: bfloat16
    reduce_dtype: float32
  replicate_params: []
  requires_grad_sync: true
  reshard_after_backward: true
  reshard_after_forward: true
loss_fn:
  _target_: hyper_parallel.models.deepseek_v41.adapter.chunk_loss.DeepseekV41ChunkedCausalLMLoss
  chunk_size: 1024
  sequential_dspark: true
lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_config:
    lr: 3.0e-05
    lr_warmup_steps: 1
    min_lr: 0.0
  lr_decay_style: cosine
memory:
  dump_ranks:
  - 0
  enable: false
  end_step: 1
  save_path: ./output/training_demo/deepseek_v41/memory_snapshot
  stacks: all
  start_step: 0
mixed_precision:
  enabled: false
model:
  _target_: hyper_parallel.models.deepseek_v41.adapter.validation.cropped_model.build_cropped_deepseek_v41
  config_path: /xw-tree/full-v41/hf-metadata
  dspark_attention_backend: flash_v3
  dspark_attention_chunk_size: 512
  dspark_depth: 3
  dspark_target_layer_ids:
  - 37
  - 38
  - 39
  enable_candidate_pool: true
  enable_vision: true
  engram_assets_path: /xw-tree/full-v41/full-model/S1/dsv41-vlm-256die-2k-gate/engram-released-ep128.json
  engram_storage_backend: host
  exercise_post_training_indexer: false
  indexer_loss_coeff: 0.001
  load_base_model: false
  num_routed_experts: 384
  router_aux_loss_coeff: 0.0001
  router_bias_update_rate: 0.001
  text_parameter_divisor: 1
  torch_dtype: bfloat16
  validate_placement: false
  vision_parameter_divisor: 1
  dspark_activation_offload: false
  dspark_offload_pin_memory: false
  dspark_stage_checkpoint: false
  dspark_stage_checkpoint_offload: false
  dspark_num_anchors: 1024
model_init_dtype: float32
model_integration:
  mode: 'off'
optimizer:
  _target_: hyper_parallel.components.optim.Sinkhorn
  adamw_config:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-20
    lr: 0.00026
    param_patterns:
    - \.engram\.[qk]_weight$
    weight_decay: 0.1
  fp32_main_params: true
  muon_config:
    lr: 0.00026
    matched_adamw_rms: 0.18
    momentum: 0.95
    nesterov: true
    ns_steps: 5
    ns_variant: asym5
    reshape_fn:
      _target_: hyper_parallel.models.deepseek_v41.adapter.optim.headwise_muon.build_reshape_fn
      attention_head_dim: 512
      indexer_head_dim: 128
    weight_decay: 0.1
  sinkhorn_config:
    correction: 0.18
    eps: 1.0e-20
    lr: 0.00026
    momentum: 0.95
    nesterov: true
    param_groups:
    - lr: 0.0013
      param_patterns:
      - \.engram\.embed\.weight$
    steps: 11
    tau: 0.001
  swap:
    enabled: true
    optimizer_names:
    - muon
    packed_swap: true
